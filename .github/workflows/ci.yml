name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Development Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Run Ruff Lint
      run: |
        ruff check .

    - name: Validate Datasets & Schema
      run: |
        python scripts/validate_data.py

    - name: Run Full Test Suite
      run: |
        python -m unittest discover -s tests -v

    - name: Double Build & Compare SHA256
      run: |
        mkdir -p /tmp/build_a /tmp/build_b
        python scripts/build_release.py --output-dir /tmp/build_a
        python scripts/build_release.py --output-dir /tmp/build_b
        SHA_A=$(sha256sum /tmp/build_a/ComfyUI-IYKYK.zip | awk '{print $1}')
        SHA_B=$(sha256sum /tmp/build_b/ComfyUI-IYKYK.zip | awk '{print $1}')
        echo "Build A SHA256: $SHA_A"
        echo "Build B SHA256: $SHA_B"
        if [ "$SHA_A" != "$SHA_B" ]; then
          echo "❌ Deterministic build verification failed! Hash mismatch."
          exit 1
        fi
        echo "✅ Deterministic build verified: bit-for-bit identical across independent runs."
